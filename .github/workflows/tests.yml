name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU-only PyTorch keeps the install small; gradio isn't needed for the tests
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pillow matplotlib pytest
      - run: pytest -q
